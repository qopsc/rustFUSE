name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x16-with-cache
      - nscloud-cache-tag-rustfuse-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: nscloud-ubuntu-22.04-amd64-4x16-with-cache
            cache: rustfuse-linux
          - runner: nscloud-macos-sequoia-arm64-6x14-with-cache
            cache: rustfuse-macos
    runs-on:
      - ${{ matrix.runner }}
      - nscloud-cache-tag-${{ matrix.cache }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo test --all-targets

  integration:
    runs-on:
      - nscloud-ubuntu-22.04-amd64-4x16-with-cache
      - nscloud-cache-tag-rustfuse-linux
    services:
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
    env:
      RUSTFUSE_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - name: Wait for rustFS
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && exit 0
            sleep 1
          done
          exit 1
      - run: cargo test --all-targets
      - name: Object store benchmark (smoke)
        run: >
          cargo run --release -p rustfuse -- bench
          --bucket rustfuse-test --endpoint http://localhost:9000
          --access-key rustfsadmin --secret-key rustfsadmin --size-mib 64
