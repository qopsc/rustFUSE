name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: namespace-profile-rustfuse-linux-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [linux-amd64, linux-arm64, macos-arm64]
    runs-on: namespace-profile-rustfuse-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: cargo test --all-targets

  # The FUSE mount on macOS links against macFUSE, so it is built (and its
  # test runs, skipping if the runner cannot mount) only where it is
  # installed.
  macfuse:
    runs-on: namespace-profile-rustfuse-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - run: brew install --cask macfuse && brew install pkgconf
      - run: cargo clippy --all-targets --features rustfuse/macfuse
      - run: cargo test -p rustfuse-mount -p rustfuse --features rustfuse/macfuse

  # The Mac app and its File Provider extension, built unsigned (signing
  # needs an Apple team), plus the Swift protocol client's tests.
  macos-app:
    runs-on: namespace-profile-rustfuse-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      # macFUSE too, so the bundle gets its mount-mode daemon.
      - run: brew install xcodegen pkgconf && brew install --cask macfuse
      - run: swift test --package-path macos/RustFuseKit
      - name: Build the app and extension (unsigned)
        working-directory: macos
        run: |
          xcodegen generate
          xcodebuild -project rustFUSE.xcodeproj -scheme rustFUSE -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Check the app bundle
        run: |
          app=macos/build/Build/Products/Debug/rustFUSE.app
          test -x "$app/Contents/Helpers/rustfuse"
          test -d "$app/Contents/PlugIns/RustFuseFileProvider.appex"
          "$app/Contents/Helpers/rustfuse" sync --help | grep -q provider-socket
          "$app/Contents/Helpers/rustfuse" volumes --help | grep -q json
          "$app/Contents/Helpers/rustfuse-macfuse" mount --help | grep -q fskit
          plutil -p "$app/Contents/PlugIns/RustFuseFileProvider.appex/Contents/Info.plist" | grep -q fileprovider-nonui
      # The UI with sample data (`rustFUSE --screenshots`), kept as an
      # artifact and printed as small JPEGs between markers so the log alone
      # shows it. Best effort: a runner without a window server skips it.
      - name: Take screenshots
        continue-on-error: true
        run: |
          app=macos/build/Build/Products/Debug/rustFUSE.app
          mkdir -p screenshots
          "$app/Contents/MacOS/rustFUSE" --screenshots "$PWD/screenshots" &
          pid=$!
          for _ in $(seq 120); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill "$pid" 2>/dev/null || true
          ls -la screenshots
          for f in screenshots/*.png; do
            jpg="${f%.png}.jpg"
            sips -s format jpeg -s formatOptions 70 -Z 1280 "$f" --out "$jpg" >/dev/null
            echo "=== SHOT $(basename "${f%.png}") ==="
            base64 -i "$jpg" | fold -w 160
            echo "=== END ==="
          done
          ls screenshots/*.png >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  integration:
    runs-on: namespace-profile-rustfuse-linux-amd64
    services:
      rustfs:
        image: rustfs/rustfs:latest
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
    env:
      RUSTFUSE_TEST_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: rust
      - name: Wait for rustFS
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && exit 0
            sleep 1
          done
          exit 1
      - run: cargo test --all-targets
      - name: Object store benchmark (smoke)
        run: >
          cargo run --release -p rustfuse -- bench
          --bucket rustfuse-test --endpoint http://localhost:9000
          --access-key rustfsadmin --secret-key rustfsadmin --size-mib 64
