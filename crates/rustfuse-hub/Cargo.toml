[package]
name = "rustfuse-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
postcard = { version = "1.1.3", features = ["use-std"] }
rustfuse-store = { version = "0.1.0", path = "../rustfuse-store" }
rustfuse-types = { version = "0.1.0", path = "../rustfuse-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tracing = "0.1.44"
zstd = "0.14.3"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
