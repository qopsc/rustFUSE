[package]
name = "rustfuse-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
blake3 = "1.8.7"
bytes = { version = "1.12.1", features = ["serde"] }
getrandom = "0.4.3"
postcard = { version = "1.1.3", features = ["use-std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
rustfuse-store = { version = "0.1.0", path = "../rustfuse-store" }
rustfuse-types = { version = "0.1.0", path = "../rustfuse-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
tokio = { version = "1.53.3", features = ["rt", "net", "io-util", "sync", "macros", "time"] }
tracing = "0.1.44"
zstd = "0.14.3"

[dev-dependencies]
rcgen = { version = "0.13.2", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
