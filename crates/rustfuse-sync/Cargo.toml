[package]
name = "rustfuse-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
futures = "0.3.34"
getrandom = "0.4.3"
ignore = "0.4.33"
libc = "0.2.191"
notify = "8"
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
redb = "4.4.0"
rustfuse-chunk = { version = "0.1.0", path = "../rustfuse-chunk" }
rustfuse-store = { version = "0.1.0", path = "../rustfuse-store" }
rustfuse-types = { version = "0.1.0", path = "../rustfuse-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "fs"] }
tracing = "0.1.44"
zstd = "0.14.3"

[dev-dependencies]
rustfuse-chunk = { path = "../rustfuse-chunk" }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
