[package]
name = "rustfuse-chunk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
fastcdc = "5.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
rustfuse-store = { version = "0.1.0", path = "../rustfuse-store" }
rustfuse-types = { version = "0.1.0", path = "../rustfuse-types" }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "sync", "macros"] }
tracing = "0.1.44"
zstd = "0.14.3"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
