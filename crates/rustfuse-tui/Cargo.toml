[package]
name = "rustfuse-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
getrandom = "0.4.3"
ratatui = "0.30.2"
rustfuse-sync = { version = "0.1.0", path = "../rustfuse-sync" }
rustix = { version = "1.1.5", features = ["process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"
