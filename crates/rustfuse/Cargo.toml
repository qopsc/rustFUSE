[package]
name = "rustfuse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# FUSE mounts on macOS through macFUSE, which must be installed to build
# and run with it (Linux always has FUSE).
macfuse = ["rustfuse-mount/macfuse"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
getrandom = "0.4.3"
rustfuse-hub = { version = "0.1.0", path = "../rustfuse-hub" }
rustfuse-mount = { version = "0.1.0", path = "../rustfuse-mount" }
rustfuse-store = { version = "0.1.0", path = "../rustfuse-store" }
rustfuse-sync = { version = "0.1.0", path = "../rustfuse-sync" }
rustfuse-tui = { version = "0.1.0", path = "../rustfuse-tui" }
rustfuse-types = { version = "0.1.0", path = "../rustfuse-types" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
